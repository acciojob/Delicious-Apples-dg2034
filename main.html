
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Apples</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="product">
        <div class="product__photo">

            <div class="photo-container">

                <div class="photo-main">
                    <img src="YOUR_GREEN_APPLE_MAIN_IMAGE_URL"
                         alt="Fresh green apples">
                </div>

                <div class="photo-album">
                    <ul>
                        <li><img src="YOUR_GREEN_APPLE_IMAGE_URL" alt="Green apple"></li>
                        <li><img src="YOUR_APPLE_CUT_IMAGE_URL" alt="Cut apple"></li>
                        <li><img src="YOUR_APPLE_SIDE_IMAGE_URL" alt="Apple side view"></li>
                        <li><img src="YOUR_GREEN_APPLE_DETAIL_URL" alt="Green apple detail"></li>
                    </ul>
                </div>

            </div>
        </div>

        <div class="product__info">

            <h2>Delicious Apples</h2>
            <p class="code">CODE: 45999</p>

            <div class="price">
                <span>R$</span> 7.93
            </div>

            <div class="variant">
                <h3>SELECT A COLOR</h3>
                <ul>
                    <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="Green"></li>
                    <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png" alt="Yellow"></li>
                    <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png" alt="Orange"></li>
                    <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png" alt="Red"></li>
                </ul>
            </div>

            <div class="description">
                <h3>BENEFITS</h3>
                <ul>
                    <li>Apples are nutritious</li>
                    <li>Apples may be good for weight loss</li>
                    <li>Apples may be good for bone health</li>
                    <li>They're linked to a lowest risk of diabetes</li>
                </ul>
            </div>

            <button class="add-to-cart">ADD TO CART</button>

        </div>
    </main>

</body>
</html>
